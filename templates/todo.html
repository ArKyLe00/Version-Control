<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-Page</title>
</head>
<body>
    
     <form action="/submittodoitem", method="POST">
        <label for="itemName">Item Name:</label><br>
        <input type="text" id="itemName" name="itemName" placeholder="Enter item name"><br>
                
        <label for="itemDescription">Description:</label><br>
        <textarea id="itemDescription" name="itemDescription" placeholder="Enter item description"></textarea><br>

        <label for="itemID">Item ID:</label>
        <input type="text" id="itemID" name="itemID" required>

        <label for="itemUUID">Item UUID:</label>
        <input type="text" id="itemUUID" name="itemUUID" required>

        <label for="itemHash">Item Hash:</label>
        <input type="text" id="itemHash" name="itemHash" required>


        <input type="submit" value="Submit">

    </form>
    
</body>
</html>
